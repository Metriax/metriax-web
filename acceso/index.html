<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceder · metriiax</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8.5' fill='%231d1d1f'/%3E%3Cpath d='M11.68 12.06A5 5 0 0 1 11.68 19.94M14.39 8.59A9.4 9.4 0 0 1 14.39 23.41M17.10 5.13A13.8 13.8 0 0 1 17.10 26.87' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7">
<link rel="stylesheet" href="/acceso/acceso.css?v=6">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="/acceso/acceso.js?v=6" defer></script>
</head>
<body>
<main class="caja">
  <a class="marca" href="/" aria-label="metriiax, volver a la web"><svg class="lm" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8.5" fill="currentColor"/><path d="M11.68 12.06A5 5 0 0 1 11.68 19.94M14.39 8.59A9.4 9.4 0 0 1 14.39 23.41M17.10 5.13A13.8 13.8 0 0 1 17.10 26.87" stroke="var(--lm-in,#fff)" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg><span>metriiax</span></a>
  <div class="ojo">Acceso</div>
  <h1>Entra en tu panel.</h1>
  <p class="sub">Para restaurantes clientes y para el equipo de metriiax.</p>

  <section id="sesion" hidden>
    <p>Has iniciado sesión como <b id="quien"></b>.</p>
    <div id="destinos" class="destinos"></div>
    <button type="button" class="btn lin" id="salir">Cerrar sesión</button>
  </section>

  <form id="f-clave" novalidate hidden>
    <p>Bienvenido. Crea tu contraseña para entrar (mínimo 10 caracteres).</p>
    <label>Nueva contraseña
      <input id="nueva" type="password" autocomplete="new-password" minlength="10" required>
    </label>
    <label>Repítela
      <input id="nueva2" type="password" autocomplete="new-password" minlength="10" required>
    </label>
    <p id="error2" class="error" role="alert" hidden></p>
    <button class="btn" type="submit" id="guardar">Guardar y entrar</button>
  </form>

  <form id="f" novalidate>
    <label>Correo o usuario
      <input id="usuario" name="usuario" autocomplete="username" required>
    </label>
    <label id="l-codigo">Código del restaurante <small>(solo si entras con usuario, no con correo)</small>
      <input id="codigo" name="codigo" autocomplete="organization" placeholder="por ejemplo: tres-hermanos" pattern="[a-z0-9-]{2,40}">
    </label>
    <label>Contraseña
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="error" role="alert" hidden></p>
    <button class="btn" type="submit" id="entrar">Entrar</button>
    <button class="enlace" type="button" id="olvido">He olvidado mi contraseña</button>
    <p id="aviso" class="aviso" role="status" hidden></p>
  </form>

  <p class="pie">¿Aún no trabajas con nosotros? <a href="/#presupuesto">Solicita una visita</a> · <a href="mailto:hola@metriiax.com">hola@metriiax.com</a></p>
</main>
</body>
</html>
